<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jonli Quiz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f3f5f2;--g:#1b5e20;--ink:#17201a;--mut:#5d6b60}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
body.wide #app{max-width:1000px}
h1{font-size:26px;margin:8px 0 12px}
.c{text-align:center}
.card{background:#fff;border-radius:12px;padding:14px;margin:12px 0;border:1px solid #dde3dc}
input{width:100%;font:inherit;padding:14px;margin:6px 0;border:2px solid #c9d2c8;border-radius:10px;background:#fff}
input:focus{outline:3px solid #8bc34a;border-color:var(--g)}
input[type=radio]{width:26px;height:26px;margin:0 8px 0 0;accent-color:var(--g)}
.opt{display:flex;align-items:center}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:16px;width:100%;margin:6px 0;cursor:pointer;background:var(--g);color:#fff}
button.alt{background:#fff;color:var(--g);border:2px solid var(--g)}
button.sm{width:auto;padding:6px 12px;font-size:14px;float:right;background:#fff;color:#b71c1c;border:1px solid #b71c1c}
button:disabled{opacity:.45;cursor:default}
.err{color:#b71c1c;font-weight:600;min-height:1.4em}
.code{font-size:56px;font-weight:800;letter-spacing:.12em;color:var(--g)}
.ans{min-height:84px;font-size:22px;color:#fff;text-align:left;display:flex;gap:12px;align-items:center}
.a0{background:#d32f2f}.a1{background:#1565c0}.a2{background:#f9a825;color:#222}.a3{background:#2e7d32}
.ans.pick{outline:5px solid #17201a}.ans.no{opacity:.35}.ans.yes{outline:5px solid #17201a;opacity:1}
.ans b{font-size:26px;width:30px}
.q{font-size:24px;font-weight:700;margin:10px 0}
.tm{font-size:44px;font-weight:800;text-align:center}
.bar{height:10px;background:#dde3dc;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);width:100%}
ol{padding:0;margin:8px 0;list-style:none;counter-reset:n}
li{display:flex;justify-content:space-between;padding:10px 12px;border-radius:8px;background:#fff;margin:4px 0;counter-increment:n}
li:before{content:counter(n);width:28px;font-weight:800;color:var(--g)}
li span{flex:1}li.me{background:#c8e6c9;font-weight:800}
.ok{color:#2e7d32}.bad{color:#b71c1c}
.big{font-size:44px;font-weight:800}
#net{display:none;position:fixed;left:0;right:0;top:0;background:#b71c1c;color:#fff;text-align:center;padding:8px;font-size:15px}
.names{display:flex;flex-wrap:wrap;gap:6px}.names span{background:#e8f0e8;border-radius:16px;padding:4px 12px;font-size:15px}
.screen .q{font-size:40px}.screen .ans{min-height:110px;font-size:30px}.screen .code{font-size:110px}.screen li{font-size:26px}
.qr{width:min(78vw,300px);margin:12px auto;background:#fff;padding:10px;border-radius:12px}.screen .qr{width:min(60vh,420px)}.qr canvas,.qr img{width:100%!important;height:auto!important}
@media(min-width:700px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
</style>
</head>
<body>
<div id="net">Ulanish uzildi — qayta ulanmoqda…</div>
<div id="app"></div>
<script>
// ===== Umumiy =====
const $ = s => document.querySelector(s), app = $('#app');
const P = location.pathname.split('/').filter(Boolean);
const mode = ['host', 'screen', 'play'].includes(P[0]) ? P[0] : 'home', CODE = P[1] || '';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
if (mode === 'screen') document.body.classList.add('wide', 'screen');
let ws, S = null, off = 0, tries = 0, msg = '';
let joined = null; try { joined = JSON.parse(localStorage.pj || 'null'); } catch {}

// ===== Ulanish: uzilsa avtomatik qayta ulanadi va o'zini qayta tanishtiradi =====
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { tries = 0; $('#net').style.display = 'none'; hello(); };
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { $('#net').style.display = 'block'; setTimeout(connect, Math.min(5000, 500 * ++tries)); };
}
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
function hello() {
  if (mode === 'host') send({ t: 'host', code: CODE, key: localStorage['hk' + CODE] });
  if (mode === 'screen') send({ t: 'screen', code: CODE });
  if (mode === 'play' && joined) send({ t: 'join', ...joined });
}
function handle(m) {
  if (m.t === 'created') { localStorage['hk' + m.code] = m.key; location = '/host/' + m.code; }
  else if (m.t === 'joined') { joined = { code: joined ? joined.code : $('#code')?.value.trim(), name: m.name, sid: m.sid }; localStorage.pj = JSON.stringify(joined); }
  else if (m.t === 'err') { msg = m.e; if (mode === 'play' && !S) { joined = null; localStorage.removeItem('pj'); } render(); }
  else if (m.t === 'state') { S = m; off = m.now - Date.now(); msg = ''; render(); }
}

// ===== Ko'rinishlar =====
const board = t => '<ol>' + (t || []).map(x => `<li class="${x.me ? 'me' : ''}"><span>${esc(x.n)}</span><b>${x.s}</b></li>`).join('') + '</ol>';
const opts = (q, pick, correct, dis, soft) => '<div class="grid">' + q.o.map((t, j) =>
  `<button class="ans a${j} ${pick === j ? 'pick' : ''} ${correct !== undefined ? (correct === j ? 'yes' : soft ? '' : 'no') : ''}" data-ans="${j}" ${dis ? 'disabled' : ''}><b>${'ABCD'[j]}</b>${esc(t)}</button>`).join('') + '</div>';
const timer = () => `<div class="tm" id="tm"></div><div class="bar"><i id="bar"></i></div>`;
const head = () => `<p class="c">${S.qi + 1} / ${S.n}</p>`;

function render() {
  if (mode === 'home') return home();
  if (mode === 'play' && !S) return joinForm();
  if (!S) { app.innerHTML = `<p class="c err">${esc(msg) || 'Ulanmoqda…'}</p>`; return; }
  ({ play: vPlay, host: vHost, screen: vScreen })[mode]();
  tick();
  drawQR();
}

// "/" — mavzular ro'yxati va tahrirlash. Mavzular shu telefonning brauzerida saqlanadi.
let topics = [], cur = null, qs = [];
try { topics = JSON.parse(localStorage.topics || '[]'); } catch {}
if (!topics.length) { try { const d = JSON.parse(localStorage.qsdraft || 'null'); if (Array.isArray(d) && d.length) topics = [{ id: 1, name: 'Mavzu 1', qs: d }]; } catch {} }
const saveTopics = () => { try { localStorage.topics = JSON.stringify(topics); } catch {} };
const blankQ = () => ({ q: '', o: ['', '', '', ''], c: 0, time: 20 });
const findT = id => topics.find(t => String(t.id) === String(id));
function topicList() {
  app.innerHTML = '<h1>Mavzular</h1>' + (topics.length ? topics.map(t => `<div class="card"><button class="sm" data-rm="${t.id}">O‘chirish</button><b>${esc(t.name || 'Nomsiz mavzu')}</b><p>${t.qs.length} ta savol</p><button data-run="${t.id}">Xona yaratish</button><button class="alt" data-edit="${t.id}">Tahrirlash</button></div>`).join('') : '<p>Hali mavzu yo‘q. Birinchisini yarating.</p>') +
    '<button id="newt">+ Yangi mavzu</button><button class="alt" id="bk">Zaxira nusxa olish</button><button class="alt" id="rs">Zaxiradan tiklash</button><p class="err">' + esc(msg) + '</p>';
}
function home() {
  if (!cur) return topicList();
  saveTopics();
  app.innerHTML = `<h1>Mavzuni tahrirlash</h1><input data-f="name" placeholder="Mavzu nomi" value="${esc(cur.name)}">` + qs.map((x, k) => `<div class="card">
    <b>Savol ${k + 1}</b>${qs.length > 1 ? `<button class="sm" data-del="${k}">O‘chirish</button>` : ''}
    <input data-k="${k}" data-f="q" placeholder="Savol matni" value="${esc(x.q)}">
    ${x.o.map((v, j) => `<label class="opt"><input type="radio" name="c${k}" data-k="${k}" data-f="c" data-j="${j}" ${x.c === j ? 'checked' : ''}><input data-k="${k}" data-f="o" data-j="${j}" placeholder="${'ABCD'[j]} variant" value="${esc(v)}"></label>`).join('')}
    <small>Doira — to‘g‘ri javob. Vaqt (soniya):</small>
    <input type="number" min="5" max="120" data-k="${k}" data-f="time" value="${x.time}"></div>`).join('') +
    '<button class="alt" id="add">+ Savol qo‘shish</button><button id="done">Saqlash va ro‘yxatga qaytish</button>';
}
app.addEventListener('input', e => {
  const d = e.target.dataset; if (mode !== 'home' || d.f === undefined || !cur) return;
  const v = e.target.value;
  if (d.f === 'name') cur.name = v;
  else { const x = qs[d.k]; if (d.f === 'q') x.q = v; else if (d.f === 'o') x.o[d.j] = v; else if (d.f === 'c') x.c = +d.j; else x.time = +v; }
  saveTopics();
});

// "/play" — kirish oynasi
function joinForm() {
  const c = new URLSearchParams(location.search).get('c') || '';
  app.innerHTML = `<h1 class="c">O‘yinga qo‘shilish</h1><input id="code" inputmode="numeric" placeholder="Xona kodi" value="${esc(c)}"><input id="name" maxlength="20" placeholder="Ismingiz"><button id="go">O‘yinga qo‘shilish</button><p class="err">${esc(msg)}</p>`;
}

// Qatnashchi: kutish / savol / natija / yakun
function vPlay() {
  const me = S.me;
  if (S.state === 'lobby') app.innerHTML = `<div class="c"><h1>Siz o‘yinga qo‘shildingiz</h1><p class="big">${esc(me.name)}</p><p>Qatnashchilar soni: <b>${S.count}</b></p><p>Boshlovchi o‘yinni boshlashini kuting…</p></div>`;
  else if (S.state === 'question') app.innerHTML = head() + timer() + `<div class="q">${esc(S.q.text)}</div>` + opts(S.q, me.ans, undefined, me.ans !== null) + (me.ans !== null ? '<p class="c">Javobingiz qabul qilindi</p>' : '');
  else if (S.state === 'reveal') app.innerHTML = head() + `<div class="c"><p class="big ${me.ok ? 'ok' : 'bad'}">${me.ans === null ? '⏰ Vaqt tugadi' : me.ok ? '✅ To‘g‘ri!' : '❌ Noto‘g‘ri'}</p><p>+${me.pts} ball · Jami: <b>${me.score}</b></p><p>Sizning o‘rningiz: <b>${me.rank} / ${S.count}</b></p></div>` + opts(S.q, me.ans, S.correct, true) + board(S.top) + '<p class="c">Keyingi savolni kuting…</p>';
  else app.innerHTML = `<div class="c"><h1>O‘yin tugadi</h1><p>Umumiy ball</p><p class="big">${me.score}</p><p>Yakuniy o‘rningiz: <b>${me.rank} / ${S.count}</b></p></div><h1>Eng yaxshilar</h1>` + board(S.top);
}

// "/host/:kod" — boshlovchi paneli
function vHost() {
  const url = location.origin + '/play?c=' + S.code;
  let h = `<div class="c"><p>Kod:</p><div class="code">${S.code}</div>${S.state === 'lobby' ? '<div class="qr" id="qr"></div>' : ''}<p><small>${esc(url)}</small></p><a href="/screen/${S.code}" target="_blank">Katta ekranni ochish</a></div>`;
  if (S.state === 'lobby') h += `<div class="card"><b>Qatnashchilar: ${S.count}</b><div class="names">${S.names.map(n => `<span>${esc(n)}</span>`).join('')}</div></div><button data-a="start">O‘yinni boshlash</button>`;
  else if (S.state === 'question') h += head() + timer() + `<div class="q">${esc(S.q.text)}</div>` + opts(S.q, null, undefined, true) + `<p class="c">Javob berganlar: <b>${S.answered} / ${S.count}</b></p><button data-a="reveal">To‘g‘ri javobni ko‘rsatish</button>`;
  else if (S.state === 'reveal') h += head() + opts(S.q, null, S.correct, true) + `<h1>Reyting</h1>` + board(S.top) + `<button data-a="next">${S.qi + 1 < S.n ? 'Keyingi savol' : 'Yakuniy natija'}</button>`;
  else h += '<h1 class="c">O‘yin tugadi</h1>' + board(S.top);
  if (S.state !== 'end') h += '<button class="alt" data-a="end">O‘yinni tugatish</button>';
  app.innerHTML = h;
}

// "/screen/:kod" — katta ekran
function vScreen() {
  if (S.state === 'lobby') app.innerHTML = `<div class="c"><h1>Qo‘shilish: ${esc(location.host)}/play</h1><div class="code">${S.code}</div><div class="qr" id="qr"></div><p class="big">${S.count} qatnashchi</p></div>`;
  else if (S.state === 'question') app.innerHTML = head() + timer() + `<div class="q">${esc(S.q.text)}</div>` + opts(S.q, null, undefined, true) + `<p class="c big">${S.answered} / ${S.count}</p>`;
  else if (S.state === 'reveal') app.innerHTML = head() + `<div class="q">${esc(S.q.text)}</div>` + opts(S.q, null, S.correct, true) + '<h1>Reyting</h1>' + board(S.top);
  else app.innerHTML = '<h1 class="c">O‘yin tugadi — yakuniy reyting</h1>' + board(S.top);
}

// QR kod: bir marta yasaladi va qayta chizishda yangidan yasalmaydi (miltillamasligi uchun)
let qrNode = null, qrFor = '';
function drawQR() {
  const el = $('#qr'); if (!el || !window.QRCode) return;
  if (qrFor !== S.code) { qrNode = document.createElement('div'); new QRCode(qrNode, { text: location.origin + '/play?c=' + S.code, width: 300, height: 300 }); qrFor = S.code; }
  el.appendChild(qrNode);
}
// Countdown: server vaqtiga (off) asoslangan
function tick() {
  if (!S || S.state !== 'question') return;
  const t = Math.max(0, (S.end - Date.now() - off) / 1000), a = $('#tm'), b = $('#bar');
  if (a) a.textContent = Math.ceil(t);
  if (b) b.style.width = t / S.q.time * 100 + '%';
  if (t <= 0 && mode === 'play') document.querySelectorAll('.ans').forEach(x => x.disabled = true);
}
setInterval(tick, 200);

// ===== Tugmalar =====
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (b.id === 'add') { qs.push(blankQ()); home(); }
  else if (d.del) { qs.splice(+d.del, 1); home(); }
  else if (d.run) { msg = ''; send({ t: 'create', qs: findT(d.run).qs }); }
  else if (d.edit) { cur = findT(d.edit); qs = cur.qs; home(); }
  else if (d.rm) { if (confirm('Bu mavzu o‘chirilsinmi?')) { topics = topics.filter(t => String(t.id) !== d.rm); saveTopics(); topicList(); } }
  else if (b.id === 'newt') { cur = { id: Date.now(), name: '', qs: [blankQ()] }; topics.push(cur); qs = cur.qs; home(); }
  else if (b.id === 'done') { cur = null; home(); }
  else if (b.id === 'bk') { const t = JSON.stringify(topics); if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Nusxalandi. Eslatmalar (Notes) ilovasiga qo‘yib saqlang.'), () => prompt('Nusxalang:', t)); else prompt('Nusxalang:', t); }
  else if (b.id === 'rs') { const t = prompt('Zaxira matnini shu yerga qo‘ying'); try { const a = JSON.parse(t); if (Array.isArray(a)) { topics = a; saveTopics(); topicList(); } } catch { alert('Matn noto‘g‘ri'); } }
  else if (b.id === 'go') {
    const code = $('#code').value.trim(), name = $('#name').value.trim();
    if (!code) { msg = 'Xona kodini kiriting'; return joinForm(); }
    if (!name) { msg = 'Ismingizni kiriting'; return joinForm(); }
    joined = { code, name, sid: null }; send({ t: 'join', code, name });
  }
  else if (d.a) { if (d.a !== 'end' || confirm('O‘yinni tugatasizmi?')) send({ t: d.a }); }
  else if (d.ans !== undefined && mode === 'play' && S.me.ans === null) { S.me.ans = +d.ans; send({ t: 'answer', i: +d.ans }); vPlay(); }
});

connect();
render();
</script>
</body>
</html>
